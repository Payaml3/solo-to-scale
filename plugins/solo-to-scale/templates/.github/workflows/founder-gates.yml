# Generated by solo-to-scale; edit `templates/.github/workflows/founder-gates.yml` in the plugin, then run upgrade.
# A pull request that changes a gated file (founder/gates.json `paths`) passes only after a founder adds the
# founder-approved label. Make this check required in branch protection so nothing gated merges without you.
name: founder-gates
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
  issues: read
# A newer push to the same pull request cancels the run it replaces.
concurrency:
  group: founder-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  founder-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: gated changes need the founder
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I tools/approval.py pr ${{ github.event.pull_request.number }}
