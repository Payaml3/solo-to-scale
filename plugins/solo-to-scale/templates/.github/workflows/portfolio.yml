# Generated by solo-to-scale; edit `templates/.github/workflows/portfolio.yml` in the plugin, then run upgrade.
# The portfolio: one overview of several ventures, each in its own repo, rebuilt every hour from the summary each
# venture's dashboard workflow keeps. It does nothing until founder/portfolio.json lists ventures, and deploys to
# the host in that file (Cloudflare Pages) only when a Cloudflare Access login covers it. Secrets, added by the
# founder: PORTFOLIO_TOKEN (fine-grained, read-only Actions access to the venture repos), and the dashboard's
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: portfolio
on:
  push:
    branches: [main]
    paths: [founder/portfolio.json]
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: portfolio
  cancel-in-progress: true
jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: is a portfolio set up?
        id: on
        run: python -I tools/build_portfolio.py enabled --github-output "$GITHUB_OUTPUT"
      - name: build the overview from each venture's summary
        if: steps.on.outputs.enabled == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
        run: python -I tools/build_portfolio.py build --out .portfolio
      - name: is hosting set up, and behind a login?
        id: guard
        if: steps.on.outputs.enabled == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -I tools/build_portfolio.py guard --github-output "$GITHUB_OUTPUT"
      - name: deploy to Cloudflare Pages
        if: steps.guard.outputs.deploy == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .portfolio --project-name=${{ steps.guard.outputs.project }} --branch=main --commit-dirty=true
      - name: an anonymous visitor gets the login, not the portfolio
        if: steps.guard.outputs.deploy == 'yes'
        run: python -I tools/build_portfolio.py verify
