# Generated by solo-to-scale; edit `templates/.github/workflows/governance.yml` in the plugin, then run upgrade.
# Turn off: delete this file. Build checks only; deploys are decided at stage 10.
name: governance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to the same pull request cancels the run it replaces.
concurrency:
  group: governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: governance check
        env:
          GOVERNANCE_BASE: origin/${{ github.base_ref || 'main' }}
        run: python -I tools/check_governance.py
      - name: view data matches its sources
        run: |
          python -I tools/build_roadmap.py --check
          python -I tools/build_team.py --check
          python -I tools/build_traceability.py --check
      - name: operating-system tool tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tools/tests
