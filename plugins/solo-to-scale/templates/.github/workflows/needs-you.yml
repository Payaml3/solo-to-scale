# Generated by solo-to-scale; edit `templates/.github/workflows/needs-you.yml` in the plugin, then run upgrade.
# Tells you when something waits on you: approvals, escalations, blocked and stuck work, budget stops, decisions.
# It keeps one issue labelled needs-you current (assigned to you) and mentions you in a comment for each new item and
# once a day as a digest, so GitHub emails you; no secret needed. Optional plain email as well: add the secrets
# SMTP_SERVER, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD and NOTIFY_EMAIL (for example a Gmail app password).
name: needs-you
on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  schedule:
    - cron: "7 */3 * * *"   # also after each agent run; the daily digest goes on the first run after its hour
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read
jobs:
  notify:
    # Agents' own ticket events and comments skip it (a skipped job bills no minutes): the agents workflow runs it once
    # after each agent run, which is when approvals and escalations appear.
    if: >-
      (github.event_name != 'issues' && github.event_name != 'issue_comment') ||
      (github.event_name == 'issues' && github.event.sender.type != 'Bot') ||
      (github.event_name == 'issue_comment' && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    # On the job, so a skipped run (an agent's comment) never joins it. A burst of events makes at most two runs: one
    # runs, and each newer event replaces the one waiting behind it, which never starts and so costs no minutes.
    concurrency:
      group: needs-you
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: update the needs-you issue; mention the founder for new items and the daily digest
        id: notify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I tools/notify.py push --mail-out .mail
      - name: is plain email set up?
        id: smtp
        env:
          HAS_SMTP: ${{ secrets.SMTP_SERVER != '' && secrets.NOTIFY_EMAIL != '' }}
        run: echo "on=$HAS_SMTP" >> "$GITHUB_OUTPUT"
      - name: read the message
        id: mail
        if: steps.notify.outputs.mail == 'yes' && steps.smtp.outputs.on == 'true'
        run: |
          { echo "subject=$(head -c 200 .mail/subject.txt)"; } >> "$GITHUB_OUTPUT"
      - name: send it by email too
        if: steps.notify.outputs.mail == 'yes' && steps.smtp.outputs.on == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 465 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_USERNAME }}
          subject: ${{ steps.mail.outputs.subject }}
          html_body: file://.mail/body.md
          convert_markdown: true
