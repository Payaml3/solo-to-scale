# Generated by solo-to-scale; edit `templates/.github/workflows/dashboard.yml` in the plugin, then run upgrade.
# The startup dashboard: rebuilt from the repo and GitHub on every merge to main and every hour, and deployed to
# the host in founder/dashboard.json (Cloudflare Pages) only when a Cloudflare Access login covers it. Until
# hosting is set up it only builds, so you can see it works. Secrets, added by the founder: CLOUDFLARE_API_TOKEN
# (Pages: Edit; Access: Apps and Policies: Read) and CLOUDFLARE_ACCOUNT_ID. Each run also keeps a short summary
# (counts, approvals waiting, recent activity; no business documents) as the dashboard-data artifact for a portfolio.
name: dashboard
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: dashboard
  cancel-in-progress: true
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the page from the repo and GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I tools/build_dashboard.py build --out .dashboard --summary .dashboard-data/summary.json
      - name: keep the summary a portfolio reads (no business documents in it)
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data
          path: .dashboard-data/summary.json
          retention-days: 7
          if-no-files-found: error
      - name: is hosting set up, and behind a login?
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -I tools/build_dashboard.py guard --github-output "$GITHUB_OUTPUT"
      - name: deploy to Cloudflare Pages
        if: steps.guard.outputs.deploy == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .dashboard --project-name=${{ steps.guard.outputs.project }} --branch=main --commit-dirty=true
      - name: an anonymous visitor gets the login, not the dashboard
        if: steps.guard.outputs.deploy == 'yes'
        run: python -I tools/build_dashboard.py verify
