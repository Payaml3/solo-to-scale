# Generated by solo-to-scale; edit `templates/.github/workflows/dashboard.yml` in the plugin, then run upgrade.
# The startup dashboard: rebuilt from the repo and GitHub on every merge to main, on ticket and approval activity
# (debounced: a newer event cancels a build still waiting), and every hour, and deployed to
# the host in founder/dashboard.json only behind a login: Cloudflare Pages behind Cloudflare Access (the default), or,
# with provider "vercel", a Vercel project with Vercel Authentication on all deployments. Until hosting is set up it
# only builds, so you can see it works. Secrets, added by the founder: CLOUDFLARE_API_TOKEN (Pages: Edit; Access:
# Apps and Policies: Read) and CLOUDFLARE_ACCOUNT_ID, or VERCEL_TOKEN for Vercel. Each run also keeps a short summary
# (counts, approvals waiting, recent activity; no business documents) as the dashboard-data artifact for a portfolio.
name: dashboard
on:
  push:
    branches: [main]
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
concurrency:
  group: dashboard
  cancel-in-progress: true
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: wait a minute, so a burst of comments makes one build (a newer event cancels this one)
        if: github.event_name == 'issues' || github.event_name == 'issue_comment'
        run: sleep 60
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the page from the repo and GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          # Only whether each secret is set, never its value: the Setup card (tools/doctor.py) reads these.
          S2S_HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          S2S_HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          S2S_HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          S2S_HAS_PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_TOKEN != '' }}
        run: python -I tools/build_dashboard.py build --out .dashboard --summary .dashboard-data/summary.json
      - name: keep the summary a portfolio reads (no business documents in it)
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data
          path: .dashboard-data/summary.json
          retention-days: 7
          if-no-files-found: error
      - name: is hosting set up, and behind a login?
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python -I tools/build_dashboard.py guard --github-output "$GITHUB_OUTPUT"
      - name: deploy to Cloudflare Pages
        if: steps.guard.outputs.deploy == 'yes' && steps.guard.outputs.provider != 'vercel'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .dashboard --project-name=${{ steps.guard.outputs.project }} --branch=main --commit-dirty=true
      - name: deploy to Vercel (the guard found the project, its domain and Vercel Authentication on all deployments)
        if: steps.guard.outputs.deploy == 'yes' && steps.guard.outputs.provider == 'vercel'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.guard.outputs.vercel_org }}
          VERCEL_PROJECT_ID: ${{ steps.guard.outputs.vercel_project_id }}
        run: npx --yes vercel@59.26.0 deploy .dashboard --prod --yes --token "$VERCEL_TOKEN"
      - name: an anonymous visitor gets the login, not the dashboard
        if: steps.guard.outputs.deploy == 'yes'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python -I tools/build_dashboard.py verify
