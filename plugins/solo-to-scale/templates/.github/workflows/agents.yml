# Generated by solo-to-scale; edit `templates/.github/workflows/agents.yml` in the plugin, then run upgrade.
# The autopilot: the AI team starts itself. Every 30 minutes in the working day (08:00 to 19:30 UTC), on a founder's
# own ticket activity, on your /approve, /resume or /wake (the dashboard's Wake now), and right after each run,
# `tools/autopilot.py due` opens a planning ticket for the chief of staff when the current stage or the goals have
# work nobody is doing, then lists each role with work ready now. Each one gets one Claude Code run (the heartbeat
# skill: one ticket, then stop). When runs finish, it checks again, so a handoff starts the next role straight away.
# Agents' own ticket events and comments start nothing: their jobs are skipped, and a skipped job costs no Actions
# minutes. Off until founder/heartbeats.json has "autopilot": {"enabled": true}; only roles whose heartbeat is on,
# with a budget left and not paused, ever run, and founder gates still apply.
# Secret, added by the founder: CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token`; uses your Claude plan) or
# ANTHROPIC_API_KEY. The Claude GitHub app must be installed on this repo (https://github.com/apps/claude).
name: agents
on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  issue_comment:
    types: [created]
  schedule:
    # Each check bills a minute even when nothing is due, so the poll covers the working day only: 24 checks a day,
    # about 720 minutes a month at most. Work that arrives overnight starts at 08:00 UTC. Widen it if you need to.
    - cron: "11,41 8-19 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write
jobs:
  pick:
    # Only a person's activity starts a check: a founder's ticket event, or a comment that starts with /approve,
    # /resume or /wake (the dashboard's Wake now button). Agents' events and every other comment skip this job,
    # which costs nothing.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.sender.type != 'Bot') ||
      (github.event_name == 'issue_comment' && github.event.comment.user.type != 'Bot' &&
       (startsWith(github.event.comment.body, '/approve') || startsWith(github.event.comment.body, '/resume') ||
        startsWith(github.event.comment.body, '/wake')))
    runs-on: ubuntu-latest
    # A burst of ticket events makes at most two checks: one runs, and each newer event replaces the one waiting
    # behind it, which never starts and so costs no minutes. (A sleep-and-cancel debounce billed a minute per event.)
    concurrency:
      group: agents-pick
      cancel-in-progress: false
    outputs:
      run: ${{ steps.due.outputs.run }}
      matrix: ${{ steps.due.outputs.matrix }}
      parallel: ${{ steps.due.outputs.parallel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: plan, then pick the roles with work ready
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
          S2S_HAS_AGENT_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: python -I tools/autopilot.py due --github-output "$GITHUB_OUTPUT"
  run:
    needs: pick
    if: needs.pick.outputs.run == 'yes'
    # Agent runs are most of the Actions minutes. A self-hosted runner (your own Linux or macOS machine, or a small
    # VM) costs no minutes: register it, then set the repository variable S2S_AGENT_RUNNER to its label.
    runs-on: ${{ vars.S2S_AGENT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.pick.outputs.parallel) }}
      matrix:
        include: ${{ fromJSON(needs.pick.outputs.matrix) }}
    concurrency:
      group: agents-${{ matrix.role }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # So the agent can run the tests and linters itself before it hands off (a uv project; other stacks skip this).
      - if: hashFiles('uv.lock') != ''
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: install the project's dependencies
        if: hashFiles('uv.lock') != ''
        run: uv sync --all-packages --frozen || uv sync --frozen || echo "dependencies not installed; the run continues"
      - name: role:${{ matrix.role }} works one ticket
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          S2S_SESSION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/Payaml3/solo-to-scale.git
          plugins: solo-to-scale@solo-to-scale
          prompt: ${{ matrix.prompt }}
          # Follow-on runs are started by this repo's own automation; the prompt never comes from the event.
          allowed_bots: "github-actions,claude"
          claude_args: >-
            --model ${{ matrix.model }} --max-turns 80
            --allowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep,Skill,Task,TodoWrite"
      - name: list any tool the run was refused (names only)
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          LOG: ${{ steps.claude.outputs.execution_file }}
        run: python -I -c "import json,os;d=json.load(open(os.environ['LOG']));r=[x for x in d if isinstance(x,dict) and x.get('type')=='result'];print('refused tools:',sorted({str(x.get('tool_name')) for e in r for x in e.get('permission_denials') or []}) or 'none')" || true
      - name: a run that stopped early is recorded as failed and frees its lock
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I tools/autopilot.py finish ${{ matrix.role }} --session "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
  next:
    needs: [pick, run]
    if: always() && needs.pick.outputs.run == 'yes'
    runs-on: ubuntu-latest
    steps:
      # A run is when new work, approvals and escalations appear, so needs-you refreshes now instead of on every
      # ticket event. The dashboard doesn't: each rebuild is a deploy, so it rebuilds on merges and every six hours.
      - name: check again, so the next role starts straight away; refresh needs-you
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run agents.yml --repo "${{ github.repository }}"
          gh workflow run needs-you.yml --repo "${{ github.repository }}" || true
