# Generated by solo-to-scale; edit `templates/.github/workflows/tickets.yml` in the plugin, then run upgrade.
# When any issue closes (by an agent, by you, or by a merged pull request's "Closes #n"), release its claim
# and unblock the tickets that were waiting on it. Everything is recorded in the activity log.
name: tickets
on:
  issues:
    types: [closed]
permissions:
  contents: write   # delete the claim ref, refs/claims/<n>
  issues: write
concurrency:
  group: tickets-${{ github.event.issue.number }}
jobs:
  closed:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: release the claim and wake dependents
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I tools/tickets.py closed ${{ github.event.issue.number }}
