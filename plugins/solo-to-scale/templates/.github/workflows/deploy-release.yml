# Generated by solo-to-scale; edit `templates/.github/workflows/deploy-release.yml` in the plugin, then run upgrade.
# The production release (tools/release.py). Pull requests keep merging to main on green CI, and main collects them.
# Production is the `production` branch: point each production host at it (Vercel: Settings, Git, Production Branch;
# Render, Netlify and Cloudflare Pages have the same setting) and turn off its builds of other branches, so a merge
# to main or a pull request deploys nothing there. This workflow moves `production` forward to main (fast-forward
# only), tags it and lists what it brings.
#   Batched (the default): it runs only when a founder starts it (Actions, release, Run workflow). Running it is the
#   deploy approval; anyone else's run releases nothing.
#   Automatic: set the repository variable S2S_AUTO_RELEASE to true (only an admin can) and every merge to main is
#   released straight away. Unset it to go back to batched releases.
name: release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "What to release: main (everything merged so far) or a commit on main"
        default: main
        required: true
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    # A merge releases only in automatic mode; otherwise the job is skipped and bills no minutes.
    if: github.event_name == 'workflow_dispatch' || vars.S2S_AUTO_RELEASE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: only a founder's run, or a merge in automatic mode, releases
        env:
          S2S_AUTO_RELEASE: ${{ vars.S2S_AUTO_RELEASE }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
        run: python -I tools/release.py check --actor "$ACTOR" --event "$EVENT"
      - name: move production to main, tag it and list what it brings
        env:
          REF: ${{ github.event.inputs.ref || 'main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          python -I tools/release.py run --ref "$REF" --summary "$GITHUB_STEP_SUMMARY"
