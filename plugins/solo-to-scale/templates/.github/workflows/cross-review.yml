# Generated by solo-to-scale; edit `templates/.github/workflows/cross-review.yml` in the plugin, then run upgrade.
# Optional cross-review: Codex reviews Claude's PRs and Claude reviews Codex's. OFF by default.
# Turn on: set the repository variable CROSS_REVIEW to "true" and add the ANTHROPIC_API_KEY and
# OPENAI_API_KEY secrets. Before enabling, check each action's README for its current inputs and pin
# a release. A review comments only; it never approves or merges.
# Which tool wrote a PR: its branch prefix (claude/ or codex/) or a `tool:claude` / `tool:codex` label.
name: cross-review
on:
  pull_request:
    types: [opened, synchronize, labeled]
permissions:
  contents: read
  pull-requests: write
jobs:
  codex-reviews-claude:
    if: vars.CROSS_REVIEW == 'true' && (startsWith(github.head_ref, 'claude/') || contains(github.event.pull_request.labels.*.name, 'tool:claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: "Review this pull request against AGENTS.md and docs/engineering-standards.md. Comment on correctness, tests and security. Do not approve."
  claude-reviews-codex:
    if: vars.CROSS_REVIEW == 'true' && (startsWith(github.head_ref, 'codex/') || contains(github.event.pull_request.labels.*.name, 'tool:codex'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Review this pull request against AGENTS.md and docs/engineering-standards.md. Comment on correctness, tests and security. Do not approve."
