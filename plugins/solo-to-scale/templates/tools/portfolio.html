    if (!h) return null;
    return el("a", { href: h, target: "_blank", rel: "noopener noreferrer", cls: "act " + cls, title: "Opens the request on GitHub and copies " + words.trim(), on: { click: function () {

      var fail = function () { toast("Reply “" + words.trim() + "” as a comment on the request."); };
      try { navigator.clipboard.writeText(words).then(done, fail); } catch (e) { fail(); }
    } } }, label);
  }
  function actions(a) {

  }
  function tile(k, v, sub) { return el("div", { cls: "tile" }, el("div", { cls: "k", text: k }), el("div", { cls: "v", text: v }), sub ? el("div", { cls: "s", text: sub }) : null); }
  function usd(x) { return "$" + (Number(x) || 0).toFixed(2); }
  function days(iso) {

  }
  function age(iso) { var t = Date.parse(iso || ""); return isNaN(t) ? null : Math.floor((Date.now() - t) / 86400000); }
  function when(iso) { return iso ? String(iso).replace("T", " ").slice(0, 16) : ""; }
  function who(x) { return el("span", { cls: "who", text: x }); }

  function name(x) { return link(x.name, x.v.dashboard, anyHref); }

  // --- tabs ---------------------------------------------------------------------------------------------
  var TABS = [["overview", "Overview", overview], ["needs", "Needs you", needsTab], ["activity", "Activity", activityTab], ["costs", "Costs", costsTab]];

  function health(x) {

        el("div", null, el("b", { text: String((S.decisions_waiting || []).length + (S.blockers || []).length) }), "decisions and founder items"),

        el("div", null, el("b", { text: x.gok ? usd(c.total) : "?" }), "AI spend " + (S.month || D.month), x.gok && c.cap ? [el("div", { cls: "why", text: "of " + usd(c.cap) }), bar(c.total, c.cap, c.total >= c.cap ? "x" : c.total >= 0.8 * c.cap ? "w" : "")] : null)),
      el("p", { cls: "note", style: "margin:10px 0 0", text: "Summary built " + when(S.built) + " UTC" + (S.commit ? " at " + S.commit : "") +
        (last ? ". Latest: " + last.role + " " + last.action + " #" + last.ticket + ", " + when(last.at) : "") + "." }));
  }

  function overview() {
    var ok = V.filter(function (x) { return x.v.ok; });
    var cap = sum(function (x) { return x.gok ? (x.G.costs || {}).cap : 0; });
    return [
      el("div", { cls: "grid" },
        tile("Ventures", String(V.length), ok.length === V.length ? "all reporting" : (V.length - ok.length) + " not reporting"),
        tile("Approvals waiting", String(waitingAll), "only your own /approve counts, in each repo"),
        tile("Decisions waiting", String(sum(function (x) { return (x.S.decisions_waiting || []).length; })), "Proposed or Open"),
        tile("Open tickets", String(sum(function (x) { return x.gok ? (x.G.tickets || {}).open : 0; })), sum(function (x) { return x.gok ? (x.G.tickets || {}).blocked : 0; }) + " blocked"),
        tile("AI spend " + D.month, usd(sum(function (x) { return x.gok ? (x.G.costs || {}).total : 0; })), cap ? "of " + usd(cap) + " budgeted" : "")),
      V.length ? el("div", { cls: "ventures" }, V.map(card)) : panel("No ventures yet", "List them in founder/portfolio.json.")];
  }

  function needsTab() {
    var approvals = [], items = [];
    V.forEach(function (x) {
      waitingOf(x).forEach(function (a) { approvals.push({ x: x, a: a }); });
      (x.S.blockers || []).forEach(function (b) { items.push({ x: x, kind: "founder item", text: b.item, sub: b.needed_by ? "needed by " + b.needed_by : "" }); });
      (x.S.decisions_waiting || []).forEach(function (d) { items.push({ x: x, kind: d.status, text: d.id + ": " + d.decision, sub: d.date ? "since " + d.date : "" }); });

    var missing = V.filter(function (x) { return !x.gok; });

      panel("Approvals waiting for you", "Oldest first. Approve or Reject opens the request in its repo and copies the reply for you to paste; /approve always works too.", table([
        { h: "Venture", f: function (r) { return name(r.x); } }, { h: "Gate", f: function (r) { return who(r.a.gate || "gate"); } },
        { h: "Request", f: function (r) { return link("#" + r.a.number + " " + String(r.a.title || "").replace(/^\[approval\]\s*/, ""), r.a.url); } },
        { h: "Requested by", f: function (r) { return r.a.by; } }, { h: "Age", num: true, k: function (r) { return age(r.a.created); }, f: function (r) { return days(r.a.created); } },
        { h: "", f: function (r) { return actions(r.a); } }], approvals, "No approvals waiting.",
        { filters: [{ label: "Ventures", f: function (r) { return r.x.name; } }, { label: "Gates", f: function (r) { return r.a.gate; } }] })),
      panel("Decisions and founder items", null, table([
        { h: "Venture", f: function (r) { return name(r.x); } }, { h: "Kind", f: function (r) { return pill(r.kind, /founder/.test(r.kind) ? "todo" : r.kind); } },
        { h: "What", f: function (r) { return [r.text, r.sub ? el("div", { cls: "why", text: r.sub }) : null]; } }], items, "Nothing waiting.",
        { search: "Search", filters: [{ label: "Ventures", f: function (r) { return r.x.name; } }, { label: "Kinds", f: function (r) { return r.kind; } }] })),
      missing.length ? panel("Not counted here", "These ventures' approvals couldn't be read on this build.", el("ul", { cls: "list" }, missing.map(function (x) {
        return el("li", null, name(x), el("div", { cls: "why", text: x.v.ok ? (x.G.why || "GitHub data missing") : (x.v.why || "no data") }));
      }))) : null];
  }

  function activityTab() {
    var rows = [], merged = [];
    V.forEach(function (x) {
      if (!x.gok) return;
      (x.G.activity || []).forEach(function (a) { rows.push({ x: x, a: a }); });
      (x.G.merged || []).forEach(function (p) { merged.push({ x: x, p: p }); });
    });
    rows.sort(function (p, q) { return String(q.a.at).localeCompare(String(p.a.at)); });
    merged.sort(function (p, q) { return String(q.p.merged).localeCompare(String(p.p.merged)); });
    var sel = el("select", { "aria-label": "Venture" }, el("option", { value: "", text: "All ventures" }), V.map(function (x) { return el("option", { value: String(x.i), text: x.name }); }));
    var list = el("ul", { cls: "list" });

      list.textContent = "";

        if (a.to) head.push(" → ", who(a.to));
        list.appendChild(el("li", null, el("div", null, head, el("span", { cls: "note", text: "  " + when(a.at) })), a.why ? el("div", { cls: "why", text: a.why }) : null));

      panel("What the teams did", "The latest entries from each venture's activity log, newest first.", el("div", { cls: "toolbar" }, sel), list),
      panel("Recently merged", null, table([
        { h: "Venture", f: function (r) { return name(r.x); } }, { h: "Pull request", f: function (r) { return link("#" + r.p.number + " " + r.p.title, r.p.url); } },
        { h: "Merged", f: function (r) { return when(r.p.merged); } }], merged.slice(0, 30), "Nothing merged recently.",
        { search: "Search pull requests", filters: [{ label: "Ventures", f: function (r) { return r.x.name; } }] }))];
  }

  function costsTab() {
    var roles = [];
    V.forEach(function (x) { if (x.gok) ((x.G.costs || {}).roles || []).forEach(function (r) { roles.push({ x: x, r: r }); }); });
    function state(used, cap) { if (!cap) return ""; var p = used / cap; return p >= 1 ? pill("stopped", "stopped") : p >= 0.8 ? pill("over 80%", "waiting") : pill("ok", "done"); }
    return [
      panel("Spend per venture", "AI usage this month against the budgets in each venture's founder/heartbeats.json.", table([
        { h: "Venture", f: function (x) { return name(x); } },
        { h: "Spent", num: true, f: function (x) { return x.gok ? usd((x.G.costs || {}).total) : "?"; } },

        { h: "", f: function (x) { var c = x.G.costs || {}; return x.gok && c.cap ? bar(c.total, c.cap, c.total >= c.cap ? "x" : c.total >= 0.8 * c.cap ? "w" : "") : ""; } },
        { h: "State", f: function (x) { var c = x.G.costs || {}; return x.gok ? state(c.total, c.cap) : pill("no data", "todo"); } }], V, "No ventures.")),
      panel("Per role", "Warning at 80%, stop at 100%, per role in each venture.", table([

        { h: "Spent", num: true, f: function (r) { return usd(r.r.used); } }, { h: "Budget", num: true, f: function (r) { return r.r.cap ? usd(r.r.cap) : "not set"; } },
        { h: "State", f: function (r) { return state(r.r.used, r.r.cap); } }], roles, "No costs or budgets yet.",
        { filters: [{ label: "Ventures", f: function (r) { return r.x.name; } }, { label: "Roles", f: function (r) { return r.r.role; } }] }))];
  }

  // --- shell ----------------------------------------------------------------------------------------------
  document.getElementById("title").textContent = D.name || "Portfolio";
  document.getElementById("meta").textContent = "Built " + when(D.built) + " UTC from " + V.length + " venture summaries. Rebuilt every six hours; a summary older than " + D.stale_hours + " hours is marked stale.";
  var tabs = document.getElementById("tabs"), main = document.getElementById("main"), sections = {}, buttons = {};
  TABS.forEach(function (t) {

  tabs.appendChild(ink); tabs.classList.add("js"); tabs.setAttribute("data-label", "Portfolio");

  function select(id, push) {

      var on = t[0] === id;
      buttons[t[0]].setAttribute("aria-selected", on ? "true" : "false");
      buttons[t[0]].tabIndex = on ? 0 : -1;
      if (on && !sections[id]) { sections[id] = el("section", { id: "panel-" + id, role: "tabpanel", "aria-labelledby": "tab-" + id }, t[2]()); main.appendChild(sections[id]); }
      if (sections[t[0]]) sections[t[0]].hidden = !on;
    });
    if (push && sections[id]) { sections[id].classList.remove("enter"); void sections[id].offsetWidth; sections[id].classList.add("enter"); }
    if (buttons[id].scrollIntoView && push) buttons[id].scrollIntoView({ block: "nearest", inline: "nearest" });
    moveInk(id);
    if (push) { try { history.replaceState(null, "", "#" + id); } catch (e) { /* sandboxed */ } }
  }
  tabs.addEventListener("keydown", function (e) {
    var ids = TABS.map(function (t) { return t[0]; }), i = ids.indexOf((document.activeElement.id || "").slice(4));
    if (i < 0 || (e.key !== "ArrowRight" && e.key !== "ArrowLeft")) return;
    var next = ids[(i + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length];
    select(next, true); buttons[next].focus(); e.preventDefault();
  });
  window.addEventListener("hashchange", function () { select(location.hash.slice(1), false); });
  select(location.hash.slice(1), false); edges();
  var themeBtn = document.getElementById("theme");
  function getTheme() { try { return localStorage.getItem("s2s-theme"); } catch (e) { return null; } }
  function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
  applyTheme(getTheme());
  themeBtn.addEventListener("click", function () {
    var dark = document.documentElement.getAttribute("data-theme") === "dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    var t = dark ? "light" : "dark"; applyTheme(t); try { localStorage.setItem("s2s-theme", t); } catch (e) { /* private window */ }
  });
})();
