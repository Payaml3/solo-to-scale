        { h: "Role", k: function (r) { return r.role; }, f: function (r) { return [avatar(r.role, null, true), el("span", { cls: "who", text: r.role })]; } },
        { h: "Heartbeat", f: function (r) { return pill(r.b.enabled ? "on" : "off", r.b.enabled ? "done" : "todo"); } },
        { h: "Schedule (UTC)", f: function (r) { return el("span", { cls: "who", title: cronText(r.b.cron), text: r.b.cron || "-" }); } },
        { h: "Budget", num: true, f: function (r) { return r.b.monthly_budget_usd ? usd(r.b.monthly_budget_usd) : "not set"; } },
        { h: "Spent", num: true, f: function (r) { return G.ok ? usd(r.c.used) : "?"; } },
        { h: "Open tickets", num: true, f: function (r) { return G.ok ? r.t.open + (r.t.claimed ? " (" + r.t.claimed + " claimed)" : "") + (r.t.blocked ? ", " + r.t.blocked + " blocked" : "") : "?"; } }], roles)),
      panel("The advisory board", "Advisors advise and have no vote; you decide.", el("div", { cls: "grid" }, (team.board || []).map(function (b) {
        return el("div", { cls: "tile" }, el("div", { cls: "top", style: "display:flex;gap:8px;align-items:center" }, avatar(b.id),
          el("div", null, el("div", { style: "font-weight:600", text: b.name + " advisor" }), el("span", { cls: "badge", text: "AI advisor" }))),
          el("div", { cls: "k", style: "margin-top:6px", text: b.lens + " lens" }), el("div", { cls: "s", text: "Asks: " + b.asks }));
      }))),
      panel("Board memos", null, docViewer(R.memos || [], "No memos in founder/board/ yet.")),
      panel("founder/team.md", null, R.team_doc ? markdown(R.team_doc) : el("p", { cls: "empty", text: "founder/team.md is missing." }))];
  }

  function activityItem(r) {
    var head = [avatar(r.role, null, true), el("span", { cls: "who", text: r.role }), " " + r.action + " #" + r.ticket];
    if (r.to) head.push(" → ", el("span", { cls: "who", text: r.to }));
    if (r.on) head.push(" (on #" + r.on + ")");
    return el("li", null, el("div", null, head, el("span", { cls: "note", text: "  " + when(r.at) })), r.why ? el("div", { cls: "why", text: r.why }) : null);
  }

  function activityTab() {
    if (!G.ok) return ghMissing();
    var roles = {}; activity.forEach(function (r) { roles[r.role] = 1; });
    var sel = el("select", { "aria-label": "Role" }, el("option", { value: "", text: "All roles" }), Object.keys(roles).sort().map(function (r) { return el("option", { value: r, text: r }); }));
    var q = el("input", { type: "search", placeholder: "Search what was said", "aria-label": "Search" });
    var list = el("ul", { cls: "list" });
    function draw() {
      list.textContent = "";
      var term = q.value.toLowerCase(), shown = activity.filter(function (r) {
        return (!sel.value || r.role === sel.value) && (!term || (r.why + " " + r.action + " #" + r.ticket).toLowerCase().indexOf(term) >= 0);
      });
      if (!shown.length) list.appendChild(el("li", { cls: "empty", text: "No activity matches." }));
      shown.slice(0, 300).forEach(function (r) { list.appendChild(activityItem(r)); });
    }
    sel.addEventListener("change", draw); q.addEventListener("input", draw); draw();
    return [
      panel("What the roles did and said to each other", "From the activity-log issue, newest first. A record, never an approval.", el("div", { cls: "toolbar" }, sel, q), list),
      panel("Open tickets", null, table([
        { h: "#", num: true, f: function (r) { return link(String(r.number), r.url); } }, { h: "Ticket", f: function (r) { return r.title; } },
        { h: "Role", f: function (r) { return el("span", { cls: "who", text: r.role || "-" }); } },
        { h: "State", f: function (r) { return r.blocked ? pill("blocked", "blocked") : r.claimed ? pill("claimed", "progress") : pill("ready", "todo"); } }], openTickets, "No open tickets.",
        { search: "Search tickets", filters: [{ label: "Roles", f: function (r) { return r.role; } }, { label: "States", f: function (r) { return r.blocked ? "blocked" : r.claimed ? "claimed" : "ready"; } }] }))];
  }

  function decisionsTab() {
    var open = function (r) { return resolvedWords.indexOf(r.status) < 0; };
    return panel("Decision registers", "Every decision in founder/decisions.md and specs/*/decisions.md. Only you mark one Approved.", table([
      { h: "ID", f: function (r) { return r.id; } }, { h: "Decision", f: function (r) { return r.decision; } },
      { h: "Status", f: function (r) { return r.status ? pill(r.status, open(r) ? r.status : "approved") : ""; } },
      { h: "Date", f: function (r) { return r.date; } }, { h: "Age", num: true, k: function (r) { return open(r) ? age(r.date) : null; }, f: function (r) { return open(r) ? days(r.date) : ""; } },
      { h: "Register", f: function (r) { return el("span", { cls: "who", text: r.register }); } }], R.decisions || [], "No decisions yet.",
      { search: "Search decisions", filters: [{ label: "Statuses", f: function (r) { return r.status; } }, { label: "Registers", f: function (r) { return r.register; } }] }));
  }

  function approvalsTab() {
    if (!G.ok) return ghMissing();
    var cols = [
      { h: "#", num: true, f: function (r) { return link(String(r.number), r.url); } }, { h: "Gate", f: function (r) { return el("span", { cls: "who", text: r.gate }); } },
      { h: "Request", f: function (r) { return [r.title.replace(/^\[approval\]\s*/, ""), r.scope ? el("div", { cls: "why", text: "Scope: " + r.scope }) : null]; } },
      { h: "Requested by", f: function (r) { return r.by; } },
      { h: "State", f: function (r) { return pill(r.state + (r.kind === "always" ? " (always)" : ""), r.state); } },
      { h: "Age", num: true, k: function (r) { return age(r.created); }, f: function (r) { return days(r.created); } }];
    var gates = { filters: [{ label: "Gates", f: function (r) { return r.gate; } }] };
    return [
      panel("Waiting for you", "Approve or Reject opens the request on GitHub and copies the reply for you to paste; you can also reply /approve always, from anywhere, including the GitHub app. Nobody else's words count.",
        table(cols.concat([{ h: "", f: actions }]), waiting, "No approvals waiting.", gates)),
      panel("Recently decided", null, table(cols, approvals.filter(function (a) { return !(a.open && a.state === "waiting"); }), "None yet.", gates))];
  }

  function costsTab() {
    if (!G.ok) return ghMissing();
    var roles = (costs.roles || []).filter(function (r) { return r.cap || r.used; });
    return [
      el("div", { cls: "grid" }, tile("Spent in " + costs.month, usd(costs.total)), tile("Entries", String((costs.entries || []).length), (costs.entries || []).filter(function (e) { return e.how === "estimated"; }).length + " estimated")),
      panel("Budget per role", "Warning at 80%, stop at 100%. Approving a budget request adds one more month's budget for that month.", table([
        { h: "Role", f: function (r) { return el("span", { cls: "who", text: r.role }); } }, { h: "Spent", num: true, k: function (r) { return Number(r.used) || 0; }, f: function (r) { return usd(r.used); } },
        { h: "Budget", num: true, k: function (r) { return r.cap ? Number(r.cap) : null; }, f: function (r) { return r.cap ? usd(r.cap) : "not set"; } },
        { h: "", f: function (r) { if (!r.cap) return ""; var p = r.used / r.cap; return bar(r.used, r.cap, p >= 1 ? "x" : p >= 0.8 ? "w" : ""); } },
        { h: "State", f: function (r) { if (!r.cap) return ""; var p = r.used / r.cap; return p >= 1 ? pill("stopped", "stopped") : p >= 0.8 ? pill("over 80%", "waiting") : pill("ok", "done"); } }], roles, "No costs or budgets yet.")),
      panel("Cost log", "Each heartbeat run and each session handoff. Measured from the transcript where possible.", table([
        { h: "When", f: function (r) { return when(r.at); } }, { h: "Role", f: function (r) { return el("span", { cls: "who", text: r.role }); } },
        { h: "Cost", num: true, f: function (r) { return usd(r.usd); } }, { h: "How", f: function (r) { return r.how; } },
        { h: "Ticket", num: true, k: function (r) { return r.ticket || null; }, f: function (r) { return r.ticket ? "#" + r.ticket : ""; } }], (costs.entries || []).slice().reverse(), "No costs recorded this month.",
        { filters: [{ label: "Roles", f: function (r) { return r.role; } }, { label: "Kinds", f: function (r) { return r.how; } }] }))];
  }

  // --- shell ----------------------------------------------------------------------------------------------
  var back = safeHref((D.links || {}).portfolio);
  if (back) { var bk = document.getElementById("back"); bk.appendChild(el("a", { href: back, text: "← " + (D.links.portfolio_name || "Portfolio") })); bk.hidden = false; }
  document.getElementById("title").textContent = (D.project.name || "Startup") + " dashboard";
  document.getElementById("oneline").textContent = D.project.one_line || "";
  document.getElementById("meta").textContent = "Built " + when(D.built) + " UTC from " + (D.commit ? "commit " + D.commit : "the repo") +
    (G.ok ? " and GitHub (" + G.repo + ")" : "; GitHub data missing") + ". Rebuilt on every merge and every hour.";
  var tabs = document.getElementById("tabs"), main = document.getElementById("main"), sections = {}, buttons = {};
  TABS.forEach(function (t) {
    var b = el("button", { type: "button", role: "tab", id: "tab-" + t[0], "aria-controls": "panel-" + t[0], on: { click: function () { select(t[0], true); } } }, t[1],
      t[0] === "approvals" && waiting.length ? el("span", { cls: "count", text: waiting.length }) : null);
    buttons[t[0]] = b; tabs.appendChild(b);
  });
  function select(id, push) {
    if (!buttons[id]) id = "overview";
    TABS.forEach(function (t) {
      var on = t[0] === id;
      buttons[t[0]].setAttribute("aria-selected", on ? "true" : "false");
      buttons[t[0]].tabIndex = on ? 0 : -1;
      if (on && !sections[id]) { sections[id] = el("section", { id: "panel-" + id, role: "tabpanel", "aria-labelledby": "tab-" + id }, t[2]()); main.appendChild(sections[id]); }
      if (sections[t[0]]) sections[t[0]].hidden = !on;
    });
    if (buttons[id].scrollIntoView && push) buttons[id].scrollIntoView({ block: "nearest", inline: "nearest" });
    if (push) { try { history.replaceState(null, "", "#" + id); } catch (e) { /* sandboxed */ } }
  }
  tabs.addEventListener("keydown", function (e) {
    var ids = TABS.map(function (t) { return t[0]; }), i = ids.indexOf((document.activeElement.id || "").slice(4));
    if (i < 0 || (e.key !== "ArrowRight" && e.key !== "ArrowLeft")) return;
    var next = ids[(i + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length];
    select(next, true); buttons[next].focus(); e.preventDefault();
  });
  window.addEventListener("hashchange", function () { select(location.hash.slice(1), false); });
  select(location.hash.slice(1), false);
  var themeBtn = document.getElementById("theme");
  function getTheme() { try { return localStorage.getItem("s2s-theme"); } catch (e) { return null; } }
  function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
  applyTheme(getTheme());
  themeBtn.addEventListener("click", function () {
    var dark = document.documentElement.getAttribute("data-theme") === "dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    var t = dark ? "light" : "dark"; applyTheme(t); try { localStorage.setItem("s2s-theme", t); } catch (e) { /* private window */ }
  });
})();
</script>
</body>
