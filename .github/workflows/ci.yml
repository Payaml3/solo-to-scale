name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: manifests
        run: python -I tests/check_manifests.py
      - name: generated files match their sources (agents, headers, handbook)
        run: python -I tests/check_drift.py
      - name: skill and role sizes
        run: python -I tests/check_sizes.py --report
      - name: no project names in the plugin
        env:
          PROJECT_NAME_DENYLIST: ${{ secrets.PROJECT_NAME_DENYLIST }}
        run: python -I tests/check_no_project_names.py
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pytest
      - run: python -m pytest -q tests plugins/solo-to-scale/templates/tools/tests
